<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ course.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5">
        <div class="p-4 mb-4 bg-light rounded-3 shadow-sm">
            <h1 class="display-5 fw-bold text-primary">{{ course.name }}</h1>
            <p class="col-md-8 fs-4 text-muted">{{ course.description }}</p>
        </div>
        <hr class="my-4">
        <h2 class="mb-4 text-secondary">Course Lessons</h2>
        <div class="list-group">
            {% for lesson in course.lesson_set.all %}
                <div class="list-group-item list-group-item-action flex-column align-items-start mb-3 p-3 shadow-sm rounded">
                    <h5 class="mb-1 text-dark">Lesson {{ forloop.counter }}: {{ lesson.title }}</h5>
                    <p class="mb-1 text-secondary">{{ lesson.content }}</p>
                </div>
            {% empty %}
                <div class="alert alert-info" role="alert">No lessons available for this course yet.</div>
            {% endfor %}
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
